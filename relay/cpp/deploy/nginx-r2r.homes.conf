# r2r.homes -- public edge for the central node.
#
# Install as /etc/nginx/sites-available/r2r.homes and symlink into
# sites-enabled. Serves the static portal and proxies the relay's HTTP and
# WebSocket surface. The relay itself is untouched: it keeps listening on
# 8787/8788 exactly as it does on every seed node, so one binary and one unit
# file are deployed everywhere.
#
# PRIVACY: access logging is off on purpose. nginx would otherwise write a
# client IP for every request, which is precisely what the relay is built not
# to retain. Do not re-enable it, and do not add real_ip_header -- the relay
# never reads a forwarded-for header, so with this config a client address
# exists nowhere but in kernel socket state.

upstream r2r_relay {
    # Loopback plaintext. TLS to the same machine would buy nothing, and the
    # relay treats it as an ordinary inbound connection.
    server 127.0.0.1:8787;
    keepalive 32;
}

# Only requests that arrive with a WebSocket upgrade get one proxied through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name r2r.homes www.r2r.homes;

    access_log off;
    error_log /var/log/nginx/r2r.error.log crit;

    # Cloudflare talks to the origin over 443 (Full/Strict). Anything arriving
    # on 80 is either a direct hit or a misconfiguration; send it to TLS.
    location / {
        return 301 https://r2r.homes$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name r2r.homes www.r2r.homes;

    access_log off;
    error_log /var/log/nginx/r2r.error.log crit;

    # Cloudflare Origin CA certificate. Trusted by Cloudflare only, which is all
    # that is needed here: browsers see Cloudflare's own edge certificate.
    ssl_certificate     /etc/r2r/tls/cert.pem;
    ssl_certificate_key /etc/r2r/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    root /var/www/r2r.homes;
    index index.html;
    charset utf-8;

    client_max_body_size 2m;

    # --- static portal -----------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # --- WebSocket bridge --------------------------------------------------
    # wss://r2r.homes/ws  ->  ws://127.0.0.1:8787
    # /r2r is accepted too: that is the path the reference client requests when
    # it connects to a relay directly, so the same client works either way.
    # No URI part on proxy_pass: nginx forbids one in a regex location. The
    # relay accepts a WebSocket upgrade on any path, so /ws is passed through
    # unchanged and works as-is.
    location ~ ^/(ws|r2r)$ {
        proxy_pass http://r2r_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # Deliberately NOT forwarding X-Forwarded-For / X-Real-IP: the client
        # address must not reach the relay process at all.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- relay HTTP surface ------------------------------------------------
    location ~ ^/(peers\.json|node\.json|status\.json|health)$ {
        proxy_pass http://r2r_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control "no-store" always;
    }

    location /invite/ {
        proxy_pass http://r2r_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control "no-store" always;
    }

    # STUN/TURN configuration for setting up a direct call.
    location = /ice {
        proxy_pass http://r2r_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control "no-store" always;
    }

    # Voice and video messages. Must allow more than the 2 MB default, and must
    # not buffer a whole upload to disk before passing it on.
    location /blob {
        proxy_pass http://r2r_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        client_max_body_size 32m;
        client_body_buffer_size 1m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # Client binaries published by the relay's --assets directory.
    location /assets/ {
        proxy_pass http://r2r_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
