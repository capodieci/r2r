document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt-weight: 600;\n  font-display: swap;\n  src: url(\"ec07cbbf-0060-4ca6-ac56-5d3859c9fbde\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps \u2014 generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* \u2014 navigation \u2014 */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* \u2014 tables \u2014 */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* \u2014 dialog \u2014 */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* \u2014 blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) \u2014 square, transparent, hairline-bordered \u2014 */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n  <script src=\"db6c9dde-03df-4260-86ef-ecc8315fd050\"><\u002Fscript>\n  <script src=\"8c810585-8e57-4ef8-9adb-0cfbc65d56ce\"><\u002Fscript>\n  <script src=\"775d0742-3fbd-4490-ad60-42933149d3c5\"><\u002Fscript>\n  <script src=\"2c0ac410-ce07-4741-afb7-b6cd2878b25d\"><\u002Fscript>\n  <script src=\"13b873d1-0afc-4fd3-9279-537133a3b6a9\"><\u002Fscript>\n  <script src=\"2d779362-506c-4d33-8dd5-6bd8ce12a4da\"><\u002Fscript>\n  <style>\n    html,body{margin:0;padding:0;height:100%}\n    body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}\n    a{color:var(--color-accent-700)} a:hover{color:var(--color-accent-900)}\n    @keyframes r2rPulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.9);opacity:0}}\n    @keyframes r2rWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}\n    ::-webkit-scrollbar{width:10px;height:10px}\n    ::-webkit-scrollbar-thumb{background:var(--color-neutral-300);border:3px solid var(--color-bg)}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:100vh;display:flex;flex-direction:column;overflow:hidden\">\n\n  <!-- ============ SETUP (no vault yet) ============ -->\n  <sc-if value=\"{{isSetup}}\" hint-placeholder-val=\"{{true}}\">\n    <div style=\"flex:1;overflow-y:auto;display:grid;place-items:center;padding:24px;align-content:safe center;justify-content:center\">\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-neutral-400);background:transparent;width:min(560px,94vw);padding:36px 40px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display:flex;align-items:baseline;gap:10px\">\n          <div style=\"width:14px;height:14px;background:var(--color-accent);align-self:center\"><\u002Fdiv>\n          <h1 style=\"margin: 0; font-family: Arial; font-weight: 600; font-size: 30px; letter-spacing: .02em; text-transform: uppercase\">{{appName}}<\u002Fh1>\n          <span class=\"tag tag-outline\" style=\"align-self:center\">v2.0<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- home: three clean options -->\n        <sc-if value=\"{{setupHome}}\" hint-placeholder-val=\"{{true}}\">\n          <p style=\"margin:10px 0 22px;font-size:14px;color:var(--color-neutral-700);line-height:1.5\">Encrypted chat, group chat, voice and video \u2014 no server account, no blockchain. Your private key is your identity; everything is stored encrypted on this device.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <button class=\"blueprint\" style=\"position:relative;display:flex;gap:14px;align-items:center;border:1px solid var(--color-accent-400);background:transparent;padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--font-body)\" style-hover=\"background:var(--color-accent-100)\" sc-camel-on-click=\"{{onGoCard}}\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <span style=\"width:38px;height:38px;border:1px solid var(--color-accent);display:grid;place-items:center;color:var(--color-accent-700);flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"5\" height=\"5\" x=\"3\" y=\"3\"><\u002Frect><rect width=\"5\" height=\"5\" x=\"16\" y=\"3\"><\u002Frect><rect width=\"5\" height=\"5\" x=\"3\" y=\"16\"><\u002Frect><path d=\"M21 16h-3a2 2 0 0 0-2 2v3\"><\u002Fpath><path d=\"M21 21v.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.05em;font-size:15px;font-weight:600;color:var(--color-text)\">Scan setup card<\u002Fspan><span class=\"tag tag-accent\">Fastest<\u002Fspan><\u002Fspan>\n                <span style=\"display:block;font-size:12.5px;color:var(--color-neutral-700);margin-top:2px\">Got a printed card? It carries the relay and the card key \u2014 you only choose a PIN.<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"color:var(--color-neutral-500)\">\u203a<\u002Fspan>\n            <\u002Fbutton>\n            <button class=\"blueprint\" style=\"position:relative;display:flex;gap:14px;align-items:center;border:1px solid var(--color-neutral-400);background:transparent;padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--font-body)\" style-hover=\"background:var(--color-accent-100);border-color:var(--color-accent-400)\" sc-camel-on-click=\"{{onGoInvite}}\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <span style=\"width:38px;height:38px;border:1px solid var(--color-neutral-400);display:grid;place-items:center;color:var(--color-accent-700);flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 12v10H4V12\"><\u002Fpath><path d=\"M2 7h20v5H2z\"><\u002Fpath><path d=\"M12 22V7\"><\u002Fpath><path d=\"M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z\"><\u002Fpath><path d=\"M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.05em;font-size:15px;font-weight:600;color:var(--color-text)\">Use an invite code<\u002Fspan>\n                <span style=\"display:block;font-size:12.5px;color:var(--color-neutral-700);margin-top:2px\">Someone gave you a R2R-XXXX\u2026 code or link? It registers you on their relay.<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"color:var(--color-neutral-500)\">\u203a<\u002Fspan>\n            <\u002Fbutton>\n            <button class=\"blueprint\" style=\"position:relative;display:flex;gap:14px;align-items:center;border:1px solid var(--color-neutral-400);background:transparent;padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--font-body)\" style-hover=\"background:var(--color-accent-100);border-color:var(--color-accent-400)\" sc-camel-on-click=\"{{onGoRestore}}\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <span style=\"width:38px;height:38px;border:1px solid var(--color-neutral-400);display:grid;place-items:center;color:var(--color-accent-700);flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.05em;font-size:15px;font-weight:600;color:var(--color-text)\">Restore a backup<\u002Fspan>\n                <span style=\"display:block;font-size:12.5px;color:var(--color-neutral-700);margin-top:2px\">Open an encrypted backup file with the private key it belongs to.<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"color:var(--color-neutral-500)\">\u203a<\u002Fspan>\n            <\u002Fbutton>\n            <button class=\"blueprint\" style=\"position:relative;display:flex;gap:14px;align-items:center;border:1px solid var(--color-neutral-400);background:transparent;padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--font-body)\" style-hover=\"background:var(--color-accent-100);border-color:var(--color-accent-400)\" sc-camel-on-click=\"{{onGoManual}}\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <span style=\"width:38px;height:38px;border:1px solid var(--color-neutral-400);display:grid;place-items:center;color:var(--color-accent-700);flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.05em;font-size:15px;font-weight:600;color:var(--color-text)\">Set up manually<\u002Fspan>\n                <span style=\"display:block;font-size:12.5px;color:var(--color-neutral-700);margin-top:2px\">Generate or paste a private key, pick a PIN \u2014 add your relay if you have one.<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"color:var(--color-neutral-500)\">\u203a<\u002Fspan>\n            <\u002Fbutton>\n            <button style=\"display:flex;gap:14px;align-items:center;border:1px dashed var(--color-neutral-400);background:transparent;padding:11px 16px;cursor:pointer;text-align:left;font-family:var(--font-body)\" style-hover=\"border-color:var(--color-accent);background:var(--color-accent-100)\" sc-camel-on-click=\"{{onGoRelay}}\">\n              <span style=\"width:38px;height:38px;display:grid;place-items:center;color:var(--color-neutral-600);flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"20\" height=\"8\" x=\"2\" y=\"2\"><\u002Frect><rect width=\"20\" height=\"8\" x=\"2\" y=\"14\"><\u002Frect><line x1=\"6\" x2=\"6.01\" y1=\"6\" y2=\"6\"><\u002Fline><line x1=\"6\" x2=\"6.01\" y1=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.05em;font-size:13.5px;font-weight:600;color:var(--color-neutral-700)\">Set up your own relay first<\u002Fspan>\n                <span style=\"display:block;font-size:12px;color:var(--color-neutral-600);margin-top:2px\">One small program (r2r-relay) on any always-on machine \u2014 get it running before you create an identity.<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"color:var(--color-neutral-500)\">\u203a<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- page: host a relay (reachable before any identity exists) -->\n        <sc-if value=\"{{setupPageRelay}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"margin:14px 0 4px\"><a href=\"#\" sc-camel-on-click=\"{{onSetupBack}}\" style=\"font-size:12.5px;text-decoration:none\">\u2039 All options<\u002Fa><\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:600;margin-bottom:10px\">Set up your own relay<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.55;margin-bottom:12px\">A relay is one small program (<span style=\"font-family:monospace\">r2r-relay<\u002Fspan>) \u2014 your mailbox, meeting point and a node of the R2R relay network. Any always-on machine with an open TCP port works: a \u20ac3/month VPS, an old PC, a Raspberry Pi. No account needed first.<\u002Fdiv>\n          <sc-if value=\"{{rlChosen}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"display:flex;align-items:center;gap:10px;border:1px solid var(--color-accent-300);background:var(--color-accent-100);padding:8px 12px;margin-bottom:14px;flex-wrap:wrap\">\n              <span style=\"font-size:12.5px;flex:1;min-width:180px\">Get <b style=\"font-family:monospace\">r2r-relay<\u002Fb> from any running relay's <b style=\"font-family:monospace\">/downloads<\u002Fb> page \u2014 every relay redistributes its own binary and source.<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{rlSteps}}\" as=\"st\" hint-placeholder-count=\"0\">\n              <div style=\"margin-bottom:13px\">\n                <div style=\"font-size:12.5px;font-weight:600;margin-bottom:4px\"><span style=\"color:var(--color-accent-700)\">{{st.n}}<\u002Fspan> {{st.t}}<\u002Fdiv>\n                <sc-if value=\"{{st.x}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:12px;color:var(--color-neutral-600);line-height:1.5;margin-bottom:5px\">{{st.x}}<\u002Fdiv><\u002Fsc-if>\n                <sc-if value=\"{{st.c}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"position:relative\">\n                    <div style=\"font-family:monospace;font-size:11.5px;line-height:1.7;border:1px solid var(--color-neutral-300);background:var(--color-neutral-100);padding:8px 36px 8px 11px;overflow-x:auto;white-space:pre\">{{st.c}}<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{st.copy}}\" title=\"Copy to clipboard\" style=\"position:absolute;top:5px;right:5px;width:24px;height:24px;border:1px solid var(--color-neutral-300);background:var(--color-bg);cursor:pointer;display:grid;place-items:center;color:var(--color-neutral-600)\" style-hover=\"color:var(--color-accent-700);border-color:var(--color-accent)\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\"><\u002Frect><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{st.more}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"margin-top:6px\"><a href=\"#\" sc-camel-on-click=\"{{onRlMoreToggle}}\" style=\"font-size:12px\">{{rlMoreLabel}}<\u002Fa><\u002Fdiv>\n                  <sc-if value=\"{{rlMoreOpen}}\" hint-placeholder-val=\"{{false}}\">\n                    <div style=\"font-family:monospace;font-size:11.5px;line-height:1.8;border:1px solid var(--color-neutral-300);background:var(--color-neutral-100);padding:8px 11px;margin-top:6px;overflow-x:auto;white-space:pre\">{{rlAllSettings}}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:var(--color-neutral-600);line-height:1.5;margin-top:5px\">Every setting works both ways: in front of the run command (that launch only), or as an <span style=\"font-family:monospace\">Environment=<\u002Fspan> line inside the service below (permanent, survives reboots).<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.55;border-top:1px solid var(--color-neutral-300);padding-top:10px\">Done. Go back to <a href=\"#\" sc-camel-on-click=\"{{onGoManual}}\">Set up manually<\u002Fa>, paste the printed <span style=\"font-family:monospace\">ws://YOUR-IP:8787<\u002Fspan> address as your relay and hit <b>Test<\u002Fb> \u2014 or mint invite codes on the relay (<span style=\"font-family:monospace\">./r2r-relay --db \u2026/r2r.db --mint-invites 3<\u002Fspan>) and use <a href=\"#\" sc-camel-on-click=\"{{onGoInvite}}\">Use an invite code<\u002Fa>.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- page: setup card -->\n        <sc-if value=\"{{setupPageCard}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"margin:14px 0 4px\"><a href=\"#\" sc-camel-on-click=\"{{onSetupBack}}\" style=\"font-size:12.5px;text-decoration:none\">\u2039 All options<\u002Fa><\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:600;margin-bottom:10px\">Scan setup card<\u002Fdiv>\n          <sc-if value=\"{{cardNotStaged}}\" hint-placeholder-val=\"{{true}}\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.45;margin-bottom:10px\">Point the camera at the card's QR \u2014 it carries the relay and the card key; the card is useless to anyone without your PIN.<\u002Fdiv>\n            <sc-if value=\"{{cardScan}}\" hint-placeholder-val=\"{{true}}\">\n              <video ref=\"{{cardScanVideoRef}}\" autoplay=\"autoplay\" playsinline=\"playsinline\" muted=\"muted\" style=\"width:100%;height:220px;object-fit:cover;border:1px solid var(--color-neutral-400);margin-bottom:4px;background:#0b0f14\"><\u002Fvideo>\n              <div style=\"font-size:11px;font-family:monospace;color:var(--color-neutral-500);margin-bottom:10px\">{{scanDebug}}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onCardScanToggle}}\">{{cardScanLabel}}<\u002Fbutton>\n              <span style=\"font-size:11.5px;color:var(--color-neutral-500)\">no camera?<\u002Fspan>\n              <input class=\"input\" ref=\"{{cardPasteRef}}\" placeholder=\"paste R2RSC1:\u2026 here\" style=\"flex:1;min-width:160px;font-family:monospace;font-size:12px\">\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onCardPaste}}\">Use<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{cardStaged}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"display:flex;gap:7px;align-items:center;font-size:13px;font-weight:600;color:oklch(0.5 0.12 150);margin-bottom:10px\"><span style=\"flex:none;width:8px;height:8px;background:oklch(0.5 0.12 150)\"><\u002Fspan><span>Card read successfully.<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-800);margin-bottom:10px\">Now choose a PIN \u2014 at least 8 characters; a longer passphrase with letters is far stronger. It becomes part of your identity: type it carefully, twice.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n              <input class=\"input\" ref=\"{{cardPinRef}}\" type=\"password\" placeholder=\"PIN (min 8)\" style=\"flex:1;min-width:150px\" sc-camel-on-input=\"{{onPinType}}\">\n              <input class=\"input\" ref=\"{{cardPin2Ref}}\" type=\"password\" placeholder=\"Repeat PIN\" style=\"{{cardPin2Style}}\" sc-camel-on-input=\"{{onPinType}}\">\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:4px;margin-top:8px\"><sc-for list=\"{{cardPinMeterSegs}}\" as=\"sg\" hint-placeholder-count=\"3\"><div style=\"{{sg.style}}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center;margin-top:12px\">\n              <button class=\"btn btn-primary blueprint\" style=\"{{cardGoStyle}}\" sc-camel-on-click=\"{{onCardContinue}}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>{{cardGoLabel}}<\u002Fbutton>\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onCardCancel}}\">Cancel<\u002Fbutton>\n              <div style=\"flex:1;text-align:right;font-size:12px;min-width:0\">\n                <sc-if value=\"{{cardPinMeterShow}}\" hint-placeholder-val=\"{{false}}\"><span style=\"{{cardPinMeterLabelStyle}}\">{{cardPinMeterLabel}}<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{cardPinMismatch}}\" hint-placeholder-val=\"{{false}}\"><span style=\"color:oklch(0.5 0.16 27)\"> \u00b7 The two PINs don't match yet.<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:14px;font-weight:700;color:#fff;background:oklch(0.5 0.2 27);border:1px solid oklch(0.4 0.2 27);padding:12px 14px;margin-top:14px;line-height:1.45\">{{err}}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:oklch(0.5 0.16 27);border:1px solid oklch(0.5 0.16 27);padding:9px 12px;margin-top:14px\"><span style=\"flex:none;width:8px;height:8px;background:oklch(0.5 0.16 27);margin-top:4px\"><\u002Fspan><span><strong>ATTENTION:<\u002Fstrong> When you will use this PIN to unlock the app, there will be no \u201cwrong PIN\u201d. Each PIN opens a different identity. You can manage multiple accounts simply using different PINs on the same card. Thus, if unlocking the wallet everything looks empty, it may well be a typo: retry with your correct PIN.<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{cardNotStaged}}\" hint-placeholder-val=\"{{false}}\"><sc-if value=\"{{err}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:13px;color:var(--color-accent-900);background:var(--color-accent-100);border:1px solid var(--color-accent-300);padding:8px 12px;margin-top:12px\">{{err}}<\u002Fdiv><\u002Fsc-if><\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- page: invite code -->\n        <sc-if value=\"{{setupPageInvite}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"margin:14px 0 4px\"><a href=\"#\" sc-camel-on-click=\"{{onSetupBack}}\" style=\"font-size:12.5px;text-decoration:none\">\u2039 All options<\u002Fa><\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:600;margin-bottom:10px\">Use an invite code<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.5;margin-bottom:12px\">An invite registers a brand-new identity on its relay. Paste the code (R2R-XXXX-XXXX-\u2026) or the invite link \u2014 hinted codes carry their relay's address inside; otherwise add the relay address too. Claiming grants you three codes of your own to pass on.<\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:12px\"><label>Invite code or link<\u002Flabel>\n            <input class=\"input\" ref=\"{{invCodeRef}}\" placeholder=\"R2R-XXXX-XXXX-XXXX-XXXX-XXXX or https://relay/\u2026\" style=\"width:100%;box-sizing:border-box;font-family:monospace;font-size:12.5px\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:12px\"><label>Relay (only if the code doesn't name one)<\u002Flabel>\n            <input class=\"input\" ref=\"{{invRelayRef}}\" placeholder=\"wss://relay.example.com or ws://203.0.113.7:8787\" style=\"width:100%;box-sizing:border-box;font-family:monospace;font-size:12.5px\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:14px\"><label>PIN or passphrase for this device<\u002Flabel>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <input class=\"input\" ref=\"{{invPinRef}}\" type=\"password\" placeholder=\"8+ characters \u2014 a phrase is strongest\" style=\"flex:1;min-width:180px\" sc-camel-on-input=\"{{onPinType}}\">\n              <input class=\"input\" ref=\"{{invPin2Ref}}\" type=\"password\" placeholder=\"Repeat PIN\" style=\"{{invPin2Style}}\" sc-camel-on-input=\"{{onPinType}}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:14px;font-weight:700;color:#fff;background:oklch(0.5 0.2 27);border:1px solid oklch(0.4 0.2 27);padding:12px 14px;margin-bottom:14px;line-height:1.45\">{{err}}<\u002Fdiv><\u002Fsc-if>\n          <button class=\"btn btn-primary blueprint\" style=\"position:relative\" sc-camel-on-click=\"{{onInviteGo}}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>{{invGoLabel}}<\u002Fbutton>\n          <div style=\"font-size:12px;color:var(--color-neutral-600);margin-top:10px\">A fresh private key is generated for you \u2014 see and back it up later in Settings. Without an invite a relay still stores your mail, but with a minimal 1 MB quota.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- page: manual -->\n        <sc-if value=\"{{setupPageManual}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"margin:14px 0 4px\"><a href=\"#\" sc-camel-on-click=\"{{onSetupBack}}\" style=\"font-size:12.5px;text-decoration:none\">\u2039 All options<\u002Fa><\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:600;margin-bottom:10px\">Set up manually<\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:14px\">\n            <label>Private key<\u002Flabel>\n            <div style=\"display:flex;gap:8px\">\n              <input class=\"input\" ref=\"{{setupKeyRef}}\" placeholder=\"64 hex characters \u2014 or press Generate\" style=\"flex:1;font-family:monospace;font-size:13px\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onGenKey}}\">Generate<\u002Fbutton>\n              <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{onCopySetupKey}}\" title=\"Copy the key\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\"><\u002Frect><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{genNote}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:12px;color:var(--color-accent-700);margin-top:6px\">New key generated \u2014 copy it somewhere safe. It is the only way to restore your history.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:14px\">\n            <label>PIN or passphrase for this device<\u002Flabel>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <input class=\"input\" ref=\"{{setupPinRef}}\" type=\"password\" placeholder=\"8+ characters \u2014 a phrase is strongest\" style=\"flex:1;min-width:180px\" sc-camel-on-input=\"{{onPinType}}\">\n              <input class=\"input\" ref=\"{{setupPin2Ref}}\" type=\"password\" placeholder=\"Repeat PIN\" style=\"{{setupPin2Style}}\" sc-camel-on-input=\"{{onPinType}}\">\n            <\u002Fdiv>\n            <sc-if value=\"{{pinMeterShow}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"display:flex;gap:4px;margin-top:8px\"><sc-for list=\"{{pinMeterSegs}}\" as=\"sg\" hint-placeholder-count=\"0\"><div style=\"{{sg.style}}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <div style=\"{{pinMeterLabelStyle}}\">{{pinMeterLabel}}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:12px;color:var(--color-neutral-600);margin-top:6px\">Unlocks the app on this device. Letters and words make it far stronger than digits.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:20px\">\n            <label>Your relays (optional)<\u002Flabel>\n            <div style=\"display:flex;gap:8px;align-items:flex-start\">\n              <div style=\"{{relayTaStyle}}\">\n                <div style=\"display:flex;gap:10px;align-items:center;border-bottom:1px dashed var(--color-neutral-400);padding-bottom:6px;margin-bottom:6px\">\n                  <span style=\"flex:none;width:58px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-500)\">main<\u002Fspan>\n                  <input ref=\"{{setupRelayRef}}\" placeholder=\"ws://203.0.113.7:8787\" style=\"flex:1;min-width:0;border:0;background:transparent;font-family:monospace;font-size:13px;padding:0;color:inherit\" style-focus=\"outline:1px solid var(--color-accent-300);outline-offset:3px\">\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px;align-items:flex-start\">\n                  <span style=\"flex:none;width:58px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-500);margin-top:2px\">fallback<\u002Fspan>\n                  <textarea ref=\"{{setupRelayFbRef}}\" rows=\"2\" placeholder=\"the others \u2014 one per line (optional)\" style=\"flex:1;min-width:0;border:0;background:transparent;font-family:monospace;font-size:13px;padding:0;resize:vertical;color:inherit\" style-focus=\"outline:1px solid var(--color-accent-300);outline-offset:3px\"><\u002Ftextarea>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{relayTested}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"flex:1;min-width:0;box-sizing:border-box;border:1px solid var(--color-neutral-400);background:var(--color-neutral-100);padding:8px 10px;font-family:monospace;font-size:13px;line-height:1.7\">\n                  <sc-for list=\"{{relayTestRows}}\" as=\"rr\" hint-placeholder-count=\"0\">\n                    <div style=\"{{rr.rowStyle}}\"><span style=\"{{rr.tagStyle}}\">{{rr.tag}}<\u002Fspan><span style=\"{{rr.addrStyle}}\">{{rr.addr}}<\u002Fspan><span style=\"{{rr.statusStyle}}\">{{rr.status}}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onTestRelay}}\">{{relayTestLabel}}<\u002Fbutton>\n                <sc-if value=\"{{relayTested}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onTestClear}}\">Clear<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{relayTestMsg}}\" hint-placeholder-val=\"{{false}}\"><div style=\"{{relayTestStyle}}\">{{relayTestMsg}}<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{relayTested}}\" hint-placeholder-val=\"{{false}}\"><div style=\"{{relayNoteStyle}}\"><span style=\"{{relayNoteSq}}\"><\u002Fspan><span>{{relayNoteText}}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n            <div style=\"font-size:12px;color:var(--color-neutral-600);margin-top:6px\">Fallbacks are used when the main relay is down \u2014 you can reorder them any time in Settings. No relay yet? Leave it blank \u2014 the app adopts the relay from the first invite you scan. If you've used this key before and synced history to your relay, it downloads back automatically.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:13px;color:var(--color-accent-900);background:var(--color-accent-100);border:1px solid var(--color-accent-300);padding:8px 12px;margin-bottom:14px\">{{err}}<\u002Fdiv><\u002Fsc-if>\n          <button class=\"btn btn-primary blueprint\" style=\"position:relative\" sc-camel-on-click=\"{{onCreate}}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Create my identity<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <!-- page: restore -->\n        <sc-if value=\"{{setupPageRestore}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"margin:14px 0 4px\"><a href=\"#\" sc-camel-on-click=\"{{onSetupBack}}\" style=\"font-size:12.5px;text-decoration:none\">\u2039 All options<\u002Fa><\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:600;margin-bottom:10px\">Restore a backup<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.5;margin-bottom:14px\">A backup is <b>one file<\u002Fb>, encrypted with a key derived from your private key \u2014 the private key itself is never inside it. The file alone is useless; the key alone holds no history. Keep them in different places and bring them together only here. (Want PIN-only restores? That's exactly what a <b>setup card<\u002Fb> does \u2014 its card key is the second secret.)<\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:10px\"><label>Backup file \u2014 or paste its text<\u002Flabel>\n            <input type=\"file\" ref=\"{{restoreFileRef}}\" sc-camel-on-change=\"{{onRestoreFile}}\" style=\"font-size:12px;display:block;margin-bottom:6px\">\n            <textarea class=\"input\" ref=\"{{restoreTextRef}}\" rows=\"3\" placeholder=\"R2RBK1:\u2026\" style=\"font-family:monospace;font-size:12px;width:100%;box-sizing:border-box\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:10px\"><label>Private key of the backup<\u002Flabel>\n            <input class=\"input\" ref=\"{{restoreKeyRef}}\" placeholder=\"The key you saved when you created this identity\" style=\"width:100%;box-sizing:border-box;font-family:monospace;font-size:13px\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:14px\"><label>New PIN or passphrase for this device<\u002Flabel>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <input class=\"input\" ref=\"{{restorePinRef}}\" type=\"password\" placeholder=\"8+ characters \u2014 a phrase is strongest\" style=\"flex:1;min-width:180px\" sc-camel-on-input=\"{{onPinType}}\">\n              <input class=\"input\" ref=\"{{restorePin2Ref}}\" type=\"password\" placeholder=\"Repeat PIN\" style=\"{{restorePin2Style}}\" sc-camel-on-input=\"{{onPinType}}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:13px;color:var(--color-accent-900);background:var(--color-accent-100);border:1px solid var(--color-accent-300);padding:8px 12px;margin-bottom:14px\">{{err}}<\u002Fdiv><\u002Fsc-if>\n          <button class=\"btn btn-primary blueprint\" style=\"position:relative\" sc-camel-on-click=\"{{onRestore}}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Restore<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ LOCKED ============ -->\n  <sc-if value=\"{{isLocked}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"flex:1;display:grid;place-items:center;padding:24px\">\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-neutral-400);width:min(420px,94vw);padding:36px 40px;text-align:center\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"width:44px;height:44px;border:1px soli
