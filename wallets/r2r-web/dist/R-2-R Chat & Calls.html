div>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{modalMailCompose}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position:fixed;inset:0;background:rgba(20,26,32,.5);display:grid;place-items:center;z-index:50\" sc-camel-on-click=\"{{stop}}\">\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-neutral-400);background:var(--color-bg);padding:24px 28px;width:min(660px,94vw);max-height:88vh;overflow-y:auto\" sc-camel-on-click=\"{{stop}}\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:14px\">Compose mail<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-bottom:10px;align-items:flex-start\">\n          <label style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600);width:56px;flex:none;margin-top:8px\">To<\u002Flabel>\n          <div style=\"flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--color-neutral-300);padding:5px 8px;background:var(--color-bg)\">\n            <sc-for list=\"{{mailToChips}}\" as=\"r\" hint-placeholder-count=\"0\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-accent-300);background:var(--color-accent-100);padding:3px 8px;font-size:12.5px\">{{r.name}} <a href=\"#\" sc-camel-on-click=\"{{r.remove}}\" style=\"text-decoration:none;color:var(--color-neutral-600);font-size:14px;line-height:1\">\u00d7<\u002Fa><\u002Fspan>\n            <\u002Fsc-for>\n            <sc-raw-select ref=\"{{mailToRef}}\" sc-camel-on-change=\"{{onMailToAdd}}\" style=\"border:none;background:transparent;font-size:13px;min-width:150px;flex:1;padding:4px 0;color:var(--color-neutral-700);outline:none\">\n              <option value=\"\">Add recipient\u2026<\u002Foption>\n              <sc-for list=\"{{contactOpts}}\" as=\"o\" hint-placeholder-count=\"0\"><option value=\"{{o.pub}}\">{{o.name}}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-bottom:10px;align-items:center\">\n          <label style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600);width:56px;flex:none\">Subject<\u002Flabel>\n          <input class=\"input\" ref=\"{{mailSubjRef}}\" placeholder=\"Subject\" style=\"flex:1;font-size:13.5px\">\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-bottom:0;border:1px solid var(--color-neutral-300);border-bottom:none;padding:6px 8px;background:var(--color-neutral-100)\">\n          <button class=\"btn btn-icon btn-ghost\" style=\"width:30px;height:30px;font-weight:700\" sc-camel-on-mouse-down=\"{{onFmtB}}\" title=\"Bold\">B<\u002Fbutton>\n          <button class=\"btn btn-icon btn-ghost\" style=\"width:30px;height:30px;font-style:italic;font-family:serif\" sc-camel-on-mouse-down=\"{{onFmtI}}\" title=\"Italic\">I<\u002Fbutton>\n          <button class=\"btn btn-icon btn-ghost\" style=\"width:30px;height:30px;text-decoration:underline\" sc-camel-on-mouse-down=\"{{onFmtU}}\" title=\"Underline\">U<\u002Fbutton>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <span style=\"font-size:11px;color:var(--color-neutral-500);align-self:center\">Encrypted end-to-end, like everything else<\u002Fspan>\n        <\u002Fdiv>\n        <div ref=\"{{mailBodyRef}}\" contenteditable=\"true\" style=\"border:1px solid var(--color-neutral-300);min-height:200px;max-height:340px;overflow-y:auto;padding:12px 14px;font-size:14px;line-height:1.55;background:var(--color-bg);outline:none;margin-bottom:12px\"><\u002Fdiv>\n        <input type=\"file\" ref=\"{{mailFilesRef}}\" sc-camel-on-change=\"{{onMailFiles}}\" multiple=\"multiple\" style=\"display:none\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center\">\n          <button class=\"btn btn-secondary\" style=\"padding:5px 12px;font-size:12.5px\" sc-camel-on-click=\"{{onMailAttach}}\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-2px;margin-right:5px\"><path d=\"m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48\"><\u002Fpath><\u002Fsvg>Attach files\n          <\u002Fbutton>\n          <sc-for list=\"{{mailAttChips}}\" as=\"f\" hint-placeholder-count=\"0\">\n            <span style=\"display:inline-flex;align-items:center;gap:7px;border:1px solid var(--color-neutral-300);padding:5px 9px;font-size:12px;background:var(--color-neutral-100)\">\n              {{f.name}} <span style=\"color:var(--color-neutral-500)\">{{f.sizeLabel}}<\u002Fspan>\n              <a href=\"#\" sc-camel-on-click=\"{{f.remove}}\" style=\"text-decoration:none;color:var(--color-neutral-600);font-size:14px;line-height:1\">\u00d7<\u002Fa>\n            <\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:13px;color:var(--color-accent-900);background:var(--color-accent-100);border:1px solid var(--color-accent-300);padding:8px 12px;margin-bottom:12px\">{{err}}<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex;gap:10px\">\n          <button class=\"btn btn-primary blueprint\" style=\"position:relative\" sc-camel-on-click=\"{{onMailSend}}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>{{mailSendLabel}}<\u002Fbutton>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onCloseModal}}\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{modalGroup}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position:fixed;inset:0;background:rgba(20,26,32,.5);display:grid;place-items:center;z-index:50\" sc-camel-on-click=\"{{onCloseModalBg}}\">\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-neutral-400);background:var(--color-bg);padding:26px 30px;width:min(460px,92vw);max-height:86vh;overflow-y:auto\" sc-camel-on-click=\"{{stop}}\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:14px\">{{groupModalTitle}}<\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:12px\"><label>Group name<\u002Flabel>\n          <input class=\"input\" ref=\"{{groupNameRef}}\" placeholder=\"Family, Project X, \u2026\" style=\"width:100%;box-sizing:border-box\">\n        <\u002Fdiv>\n        <div style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:6px\">Members<\u002Fdiv>\n        <div style=\"border:1px solid var(--color-neutral-300);max-height:220px;overflow-y:auto;margin-bottom:8px\">\n          <sc-if value=\"{{noContacts}}\" hint-placeholder-val=\"{{false}}\"><div style=\"padding:12px 14px;font-size:12.5px;color:var(--color-neutral-600)\">No contacts yet \u2014 add contacts first.<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{groupMemberRows}}\" as=\"gm\" hint-placeholder-count=\"0\">\n            <label style=\"display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--color-neutral-200);cursor:pointer;font-size:13.5px\">\n              <input type=\"checkbox\" checked=\"{{gm.checked}}\" sc-camel-on-change=\"{{gm.toggle}}\" style=\"accent-color:var(--color-accent)\">\n              <span>{{gm.name}}<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--color-neutral-600);margin-bottom:12px;line-height:1.5\">Up to 8 people per group (messages fan out from your device \u2014 the relay never learns the group exists). Group <b>calls<\u002Fb> work with up to 4 people.<\u002Fdiv>\n        <sc-if value=\"{{err}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:13px;color:var(--color-accent-900);background:var(--color-accent-100);border:1px solid var(--color-accent-300);padding:8px 12px;margin-bottom:12px\">{{err}}<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex;gap:10px\">\n          <button class=\"btn btn-primary blueprint\" style=\"position:relative\" sc-camel-on-click=\"{{onGroupSave}}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>{{groupSaveLabel}}<\u002Fbutton>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onCloseModal}}\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{modalSettings}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position:fixed;inset:0;background:rgba(20,26,32,.5);display:grid;place-items:center;z-index:50\" sc-camel-on-click=\"{{onCloseModalBg}}\">\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-neutral-400);background:var(--color-bg);padding:26px 30px;width:min(540px,92vw);max-height:86vh;overflow-y:auto\" sc-camel-on-click=\"{{stop}}\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:16px\">Settings<\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:14px\"><label>Display name (local only)<\u002Flabel>\n          <input class=\"input\" ref=\"{{setNameRef}}\" placeholder=\"Me\" style=\"max-width:260px\">\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:6px\"><label>Relays \u2014 one per line, first is used<\u002Flabel>\n          <textarea class=\"input\" ref=\"{{setRelaysRef}}\" rows=\"2\" placeholder=\"ws://203.0.113.7:8787\nwss://relay.example.com\" style=\"width:100%;box-sizing:border-box;font-family:monospace;font-size:12.5px\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-600);margin-bottom:16px\">A bare <span style=\"font-family:monospace\">IP:port<\u002Fspan> works (ws:// is assumed); relays installed under a sub-path keep the path (<span style=\"font-family:monospace\">wss://host/R2R<\u002Fspan>). This is <b>your<\u002Fb> relay \u2014 your mailbox, presence and journal live on it; contacts' own relays are learned automatically from invites and messages, and mail parked elsewhere in the network is gathered home (Mail pickup below).<\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:14px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Privacy<\u002Fdiv>\n          <label style=\"display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer;line-height:1.45\">\n            <input type=\"checkbox\" ref=\"{{onionChkRef}}\" sc-camel-on-change=\"{{onToggleOnion}}\" style=\"margin-top:2px;accent-color:var(--color-accent)\">\n            <span>Send through onion routing \u2014 each message leaves on a fresh anonymous connection and crosses up to three relays, so no single relay sees both who sent it and who it is for. Calls still connect directly.<\u002Fspan>\n          <\u002Flabel>\n          <label style=\"display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer;line-height:1.45;margin-top:10px\">\n            <input type=\"checkbox\" ref=\"{{onionExtraChkRef}}\" sc-camel-on-change=\"{{onToggleOnionExtra}}\" style=\"margin-top:2px;accent-color:var(--color-accent)\">\n            <span>Extra privacy \u2014 route through five relays instead of three. Slower, and needs a bigger network to make a difference.<\u002Fspan>\n          <\u002Flabel>\n          <div style=\"font-size:12px;color:var(--color-neutral-600);margin-top:6px\">{{onionStatus}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:14px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Backup<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:10px;line-height:1.5\">Contacts, chat history and call log \u2014 encrypted with your private key. Restore from the lock screen of any copy of this file.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onBackupFile}}\">Download backup file<\u002Fbutton>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onBackupCopy}}\">Copy as text<\u002Fbutton>\n          <\u002Fdiv>\n          <label style=\"display:flex;gap:9px;align-items:flex-start;font-size:13px;margin-top:14px;cursor:pointer;line-height:1.45\">\n            <input type=\"checkbox\" ref=\"{{syncChkRef}}\" sc-camel-on-change=\"{{onToggleSync}}\" style=\"margin-top:2px;accent-color:var(--color-accent)\">\n            <span>Keep an encrypted copy of my history on my relay \u2014 open this file anywhere fresh, enter your key + relay, and everything downloads back.<\u002Fspan>\n          <\u002Flabel>\n          <div style=\"font-size:12px;color:var(--color-neutral-600);margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n            <span>{{syncStatus}}<\u002Fspan>\n            <sc-if value=\"{{usageLabel}}\" hint-placeholder-val=\"{{false}}\"><span class=\"tag tag-outline\">{{usageLabel}}<\u002Fspan><\u002Fsc-if>\n            <a href=\"#\" sc-camel-on-click=\"{{onSyncNow}}\">Sync now<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Moving relay <a href=\"#\" sc-camel-on-click=\"{{onMigToggle}}\" style=\"font-family:var(--font-body);text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;margin-left:8px\">{{migToggleLabel}}<\u002Fa><\u002Fdiv>\n          <sc-if value=\"{{migOpen}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:10px;line-height:1.5\">Put the <b>new<\u002Fb> relay first in the Relays list above, save, then copy your history from the old one. Relays never talk to each other \u2014 this wallet ferries the records, still encrypted; neither relay ever sees anything. Run it once.<\u002Fdiv>\n            <input class=\"input\" ref=\"{{migFromRef}}\" placeholder=\"Old relay \u2014 ws://203.0.113.7:8787\" style=\"width:100%;box-sizing:border-box;font-family:monospace;font-size:12.5px;margin-bottom:8px\">\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n              <input class=\"input\" ref=\"{{migPinRef}}\" type=\"password\" placeholder=\"PIN (optional)\" style=\"width:140px\" title=\"Also registers your setup-card identity on the new relay, so the card keeps working\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onMigrate}}\">{{migGoLabel}}<\u002Fbutton>\n              <span style=\"font-size:12px;color:var(--color-neutral-600)\">{{migMsg}}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--color-neutral-500);margin-top:6px\">With your PIN it also re-registers your setup-card identity on the new relay. The card's QR still names the old relay \u2014 reissue the card in the Forge (same card key, both relays listed) when convenient.<\u002Fdiv>\n            <sc-if value=\"{{hasCardKey}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"font-size:12px;margin-top:6px\"><a href=\"#\" sc-camel-on-click=\"{{onCopyCardKey}}\">Copy my card key<\u002Fa> <span style=\"color:var(--color-neutral-500)\">\u2014 paste it into the Forge's \u201cReissue\u201d field to print a new card for the same identity.<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Mail pickup<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.5;margin-bottom:8px\">Mail sent while your home relay was unreachable can wait on other relays; the network leaves signed pointers. Gathering pulls everything home with a one-time, holder-bound authorization \u2014 it also runs automatically on every connect.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onGather}}\">{{gatherLabel}}<\u002Fbutton>\n            <span style=\"font-size:12px;color:var(--color-neutral-600)\">{{pickupLine}}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Invite codes<\u002Fdiv>\n          <sc-if value=\"{{hasMyInvites}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:8px\">Yours to give away \u2014 each registers one new person on your relay:<\u002Fdiv>\n            <sc-if value=\"{{inviteLockLine}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:12.5px;color:var(--color-neutral-700);background:var(--color-neutral-100);border-radius:6px;padding:8px 10px;margin-bottom:8px;line-height:1.45\">{{inviteLockLine}}<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{myInviteRows}}\" as=\"iv\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;gap:10px;align-items:center;font-family:monospace;font-size:12px;padding:4px 0;border-bottom:1px solid var(--color-neutral-200)\">\n                <span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{iv.code}}<\u002Fspan>\n                <sc-if value=\"{{iv.stateLabel}}\" hint-placeholder-val=\"{{false}}\"><span class=\"tag tag-outline\" style=\"font-family:var(--font-body)\">{{iv.stateLabel}}<\u002Fspan><\u002Fsc-if>\n                <a href=\"#\" sc-camel-on-click=\"{{iv.copy}}\" style=\"font-family:var(--font-body)\">copy link<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{noMyInvites}}\" hint-placeholder-val=\"{{true}}\"><div style=\"font-size:12.5px;color:var(--color-neutral-600);margin-bottom:8px\">No codes yet \u2014 claiming an invite grants you three; relay owners can mint more in the Relay owner panel.<\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px\">\n            <input class=\"input\" ref=\"{{claimCodeRef}}\" placeholder=\"Claim a code on my relay: R2R-\u2026\" style=\"flex:1;min-width:200px;font-family:monospace;font-size:12px\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onClaimCode}}\">Claim<\u002Fbutton>\n            <span style=\"font-size:12px;color:var(--color-neutral-600)\">{{claimMsg}}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Storage market <a href=\"#\" sc-camel-on-click=\"{{onMktToggle}}\" style=\"font-family:var(--font-body);text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;margin-left:8px\">{{mktToggleLabel}}<\u002Fa><\u002Fdiv>\n          <sc-if value=\"{{mktOpen}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.5;margin-bottom:10px\">Rent replica space for your encrypted history on 1\u20135 independent relays, paid in USDC through the R2RStorageVault contract. Each epoch the wallet first audits the replica (reads your own ciphertext back) and only then signs the payment voucher. The payment key is separate from your chat identity \u2014 nothing on-chain links to you.<\u002Fdiv>\n            <sc-if value=\"{{mktVaultWarn}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-size:12px;font-weight:600;color:oklch(0.5 0.16 27);border:1px solid oklch(0.5 0.16 27);padding:7px 10px;margin-bottom:10px\">The vault contract address is not yet pinned in this wallet build \u2014 rentals run on the 35-day first-epoch grace; do not deposit funds until an update pins the vault address.<\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onMktScan}}\">{{mktScanLabel}}<\u002Fbutton>\n              <span style=\"font-size:12px;color:var(--color-neutral-600)\">Size:<\u002Fspan>\n              <input class=\"input\" ref=\"{{mktMbRef}}\" placeholder=\"MB\" style=\"width:70px\">\n              <span style=\"font-size:12px;color:var(--color-neutral-600)\">{{mktMsg}}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{mktRows}}\" as=\"mk\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--color-neutral-200);align-items:center;flex-wrap:wrap\">\n                <span style=\"font-family:monospace;flex:1;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{mk.addr}}<\u002Fspan>\n                <span style=\"color:var(--color-neutral-600)\">{{mk.price}}<\u002Fspan>\n                <span style=\"color:var(--color-neutral-600)\">{{mk.free}}<\u002Fspan>\n                <sc-if value=\"{{mk.warn}}\" hint-placeholder-val=\"{{false}}\"><span style=\"color:oklch(0.5 0.16 27)\">{{mk.warn}}<\u002Fspan><\u002Fsc-if>\n                <button class=\"btn btn-ghost\" style=\"padding:3px 10px;font-size:12px\" sc-camel-on-click=\"{{mk.rent}}\">Rent<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{hasRentals}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600);margin:12px 0 4px\">My replicas<\u002Fdiv>\n              <sc-for list=\"{{rentalRows}}\" as=\"rr\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--color-neutral-200);align-items:center;flex-wrap:wrap\">\n                  <span style=\"font-family:monospace;flex:1;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{rr.addr}}<\u002Fspan>\n                  <span style=\"color:var(--color-neutral-600)\">{{rr.size}}<\u002Fspan>\n                  <span style=\"{{rr.paidStyle}}\">{{rr.paid}}<\u002Fspan>\n                  <span style=\"{{rr.auditStyle}}\">{{rr.audit}}<\u002Fspan>\n                  <button class=\"btn btn-ghost\" style=\"padding:3px 10px;font-size:12px\" sc-camel-on-click=\"{{rr.cycle}}\">Audit &amp; pay<\u002Fbutton>\n                  <button class=\"btn btn-ghost\" style=\"padding:3px 10px;font-size:12px\" sc-camel-on-click=\"{{rr.end}}\" title=\"Stop replicating and paying\">End<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px\">\n              <input class=\"input\" ref=\"{{mktRpcRef}}\" placeholder=\"EVM RPC url (optional \u2014 enables on-chain checks)\" style=\"flex:1;min-width:220px;font-family:monospace;font-size:12px\">\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onMktRpcSave}}\">Save RPC<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--color-neutral-500);margin-top:6px;line-height:1.5\">Funding: deposit USDC to the vault from any wallet you control (one-time approve, then deposit; withdrawing unused balance has a 40-day delay). Only ever approve the vault address compiled into this wallet \u2014 never one a web page or relay shows you. Replica rule of thumb: never two replicas on the same operator, host or /16 network \u2014 the wallet warns when a pick collides.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Relay owner <a href=\"#\" sc-camel-on-click=\"{{onAdminToggle}}\" style=\"font-family:var(--font-body);text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;margin-left:8px\">{{adminToggleLabel}}<\u002Fa><\u002Fdiv>\n          <sc-if value=\"{{adminOpen}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:10px;line-height:1.5\">{{adminOwnerNote}}<\u002Fdiv>\n            <sc-if value=\"{{isOwner}}\" hint-placeholder-val=\"{{false}}\">\n              <input class=\"input\" ref=\"{{adminAcctRef}}\" placeholder=\"R2R_\u2026 address or 64-hex fingerprint\" style=\"width:100%;box-sizing:border-box;font-family:monospace;font-size:12px;margin-bottom:8px\">\n              <div style=\"display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center\">\n                <input class=\"input\" ref=\"{{adminMbRef}}\" placeholder=\"MB\" style=\"width:70px\">\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onAdminApply}}\">Set quota<\u002Fbutton>\n                <input class=\"input\" ref=\"{{adminDaysRef}}\" placeholder=\"Days\" style=\"width:70px;margin-left:10px\">\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onAdminTtl}}\">Set file TTL<\u002Fbutton>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAdminDelete}}\" title=\"Press twice \u2014 removes the account and its stored data from this relay\">Delete account\u2026<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap\">\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAdminList}}\">List accounts<\u002Fbutton>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAdminMint}}\">Mint 3 invites<\u002Fbutton>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAdminInvites}}\">Open invites<\u002Fbutton>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onAdminVouchers}}\">Vouchers<\u002Fbutton>\n                <span style=\"font-size:12px;color:var(--color-neutral-600)\">{{adminMsg}}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{adminRows}}\" as=\"a\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;gap:10px;font-family:monospace;font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--color-neutral-200);align-items:center\">\n                  <span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{a.addr}}<\u002Fspan>\n                  <span style=\"color:var(--color-neutral-600)\">{{a.usage}}<\u002Fspan>\n                  <span style=\"color:var(--color-neutral-500);flex:none\">{{a.ttl}}<\u002Fspan>\n                  <sc-if value=\"{{a.revoke}}\" hint-placeholder-val=\"{{false}}\"><a href=\"#\" sc-camel-on-click=\"{{a.revoke}}\" style=\"font-family:var(--font-body)\">revoke<\u002Fa><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Run your own relay <a href=\"#\" sc-camel-on-click=\"{{onHostToggle}}\" style=\"font-family:var(--font-body);text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;margin-left:8px\">{{hostToggleLabel}}<\u002Fa><\u002Fdiv>\n          <sc-if value=\"{{hostOpen}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:10px;line-height:1.5\">A relay is one small program (<span style=\"font-family:monospace\">r2r-relay<\u002Fspan>) \u2014 any always-on machine with an open TCP port works (a \u20ac3/month VPS is plenty). Every running relay redistributes its own binary and source on its <span style=\"font-family:monospace\">/downloads<\u002Fspan> page:<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center\">\n              <a class=\"btn btn-secondary\" href=\"{{dlUrl}}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none\">{{dlUrlLabel}}<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-800);margin-bottom:6px;font-weight:600\">Setup on a fresh Linux server \u2014 one command, run on the server<\u002Fdiv>\n            <div style=\"font-family:monospace;font-size:11.5px;line-height:1.8;border:1px solid var(--color-neutral-300);background:var(--color-neutral-100);padding:10px 12px;margin-bottom:10px;overflow-x:auto;white-space:pre\"># log in to the server (SSH, root or sudo). Any relay's \u002Fdownloads page has these files:\ncurl -sSLO https:\u002F\u002Fr2r.homes\u002Fassets\u002Fr2r-relay\ncurl -sSLO https:\u002F\u002Fr2r.homes\u002Fassets\u002Finstall.sh\ncurl -sSLO https:\u002F\u002Fr2r.homes\u002Fassets\u002Fsetup-tls.sh\ncurl -sSLO https:\u002F\u002Fr2r.homes\u002Fassets\u002Fr2r-relay.service\nchmod +x r2r-relay install.sh setup-tls.sh\nsudo .\u002Finstall.sh YOUR-SERVER-IP:8787        # this server's own public IP (curl -4 ifconfig.me)\n\n# five invite codes were written on first start; mint more any time\nsudo cat \u002Fvar\u002Flib\u002Fr2r\u002Fgenesis-invites.txt\nsudo r2r-relay --mint-invites 10\n\n# make this wallet the relay's owner (paste the R2R_ address from Settings) \u2014 owner panel appears on next connect\nsudo r2r-relay --owner-add R2R_YOUR_ADDRESS<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--color-neutral-600);line-height:1.55\">The installer creates the service user, a systemd unit, a self-signed certificate and the web site your relay serves at <span style=\"font-family:monospace\">http:\u002F\u002FYOUR-SERVER-IP:8787\u002F<\u002Fspan>. Open TCP 8787 and 8788 in the firewall (and your provider\u2019s cloud firewall). Then add <span style=\"font-family:monospace\">ws:\u002F\u002FYOUR-SERVER-IP:8787<\u002Fspan> to Relays above (and onto your setup cards). No domain or TLS needed for a bare IP \u2014 everything is end-to-end encrypted anyway; TLS only hides traffic metadata. Want <span style=\"font-family:monospace\">wss:\u002F\u002F<\u002Fspan>? Point a domain at the server and run <span style=\"font-family:monospace\">.\u002Fsetup-tls.sh your.domain<\u002Fspan> (free auto-renewing certificate). Sub-path installs like <span style=\"font-family:monospace\">\u002FR2R<\u002Fspan> work \u2014 the wallet reads the relay\u2019s <span style=\"font-family:monospace\">base<\u002Fspan>.<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--color-neutral-600);line-height:1.55;margin-top:10px;margin-bottom:4px\">Per-account quotas, file lifetimes, invites and the storage market are managed live from the <b>Relay owner<\u002Fb> panel above \u2014 changes apply instantly, no restart. Run <span style=\"font-family:monospace\">./r2r-relay --help<\u002Fspan> for the full flag list (ports, TLS, advertise address, market pool), or open the relay's own <span style=\"font-family:monospace\">/admin<\u002Fspan> web console.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:14px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Change PIN <a href=\"#\" sc-camel-on-click=\"{{onCpToggle}}\" style=\"font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;margin-left:6px\">{{cpToggleLabel}}<\u002Fa><\u002Fdiv>\n          <sc-if value=\"{{cpOpen}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);line-height:1.5;margin-bottom:10px\">Your key, history, contacts and card stay exactly as they are \u2014 only the PIN wrapper changes. On a card identity the record is first re-registered under the new PIN on <b>every<\u002Fb> card relay; if any of them can't confirm, nothing changes, so a restore with the new PIN can never come up empty.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <input class=\"input\" ref=\"{{cpOldRef}}\" type=\"password\" placeholder=\"Current PIN\" style=\"flex:1;min-width:130px\" sc-camel-on-input=\"{{onPinType}}\">\n              <input class=\"input\" ref=\"{{cpNewRef}}\" type=\"password\" placeholder=\"New PIN (min 8)\" style=\"flex:1;min-width:130px\" sc-camel-on-input=\"{{onPinType}}\">\n              <input class=\"input\" ref=\"{{cpNew2Ref}}\" type=\"password\" placeholder=\"Repeat new PIN\" style=\"{{cpNew2Style}}\" sc-camel-on-input=\"{{onPinType}}\">\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;margin-top:10px\">\n              <button class=\"btn btn-secondary\" style=\"{{cpGoStyle}}\" sc-camel-on-click=\"{{onChangePin}}\">{{cpGoLabel}}<\u002Fbutton>\n              <span style=\"{{cpMsgStyle}}\">{{cpMsg}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--color-neutral-300);padding-top:14px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-bottom:8px\">Private key<\u002Fdiv>\n          <sc-if value=\"{{keyShown}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-family:monospace;font-size:12px;word-break:break-all;border:1px solid var(--color-accent-300);background:var(--color-accent-100);padding:8px 10px;margin-bottom:8px\">{{keyHex}}<\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;gap:10px\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{onToggleKey}}\">{{keyBtnLabel}}<\u002Fbutton>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onForget}}\" title=\"Removes the vault from this device \u2014 history comes back only from a backup\">Wipe this device\u2026<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;justify-content:flex-end\">\n          <button class=\"btn btn-primary blueprint\" style=\"position:relative\" sc-camel-on-click=\"{{onSaveSettings}}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Save<\u002Fbutton>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onCloseModal}}\">Close<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{modalDevices}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position:fixed;inset:0;background:rgba(20,26,32,.5);display:grid;place-items:center;z-index:70\" sc-camel-on-click=\"{{onCloseModalBg}}\">\n      <div class=\"blueprint\" style=\"position:relative;border:1px solid var(--color-neutral-400);background:var(--color-bg);padding:26px 30px;width:min(440px,92vw)\" sc-camel-on-click=\"{{stop}}\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:14px\">Camera &amp; microphone<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--color-neutral-700);margin-bottom:6px\">Microphones<\u002Fdiv>\n        <sc-for list=\"{{micRows}}\" as=\"d\" hint-placeholder-count=\"2\">\n          <button style=\"{{d.style}}\" sc-camel-on-click=\"{{d.pick}}\">{{d.label}}<\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--color-neutral-700);margin:14px 0 6px\">Cameras<\u002Fdiv>\n        <sc-for list=\"{{camRows}}\" as=\"d\" hint-placeholder-count=\"2\">\n          <button style=\"{{d.style}}\" sc-camel-on-click=\"{{d.pick}}\">{{d.label}}<\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"margin-top:16px;text-align:right\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{onCloseModal}}\">Close<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- toasts -->\n  <div style=\"position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;align-items:center\">\n    <sc-for list=\"{{toasts}}\" as=\"t\" hint-placeholder-count=\"0\">\n      <div style=\"{{t.style}}\">{{t.msg}}<\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;appName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;R2\u042f&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chat&quot;,&quot;calls&quot;],&quot;default&quot;:&quot;chat&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { tab: 'chat', sel: null, modal: null, toasts: [], err: '', genNote: false, restoreOpen: false, scanOn: false, setupScan: false, renaming: false, removeArmed: false, keyShown: false, devices: { mics: [], cams: [] }, adminOpen: false, adminRows: [], adminMsg: '', mailTo: [], groupSel: [], groupEdit: null, tick: 0 };\n  componentDidMount() {\n    this._els = this._els || {}; this._att = {}; this._attPend = {}; this._toastN = 0;\n    var Z = window.R2R, self = this;\n    var wait = setInterval(function () {\n      if (!window.R2R || !window.nacl || !window.sha3_256 || !window.R2RETH) return;\n      clearInterval(wait); self.bindCore();\n    }, 60);\n  }\n  bindCore() {\n    var self = this, Z = window.R2R;\n    Z.on('update', function () { self.forceUpdate(); });\n    Z.on('call', function () { self.syncMedia(); self.forceUpdate(); });\n    Z.on('call-tick', function () { self.setState(function (s) { retur h.round((r.bytes || 0) / 1048576) + ' MB',\n          paid: r.paidUntil ? ('paid ' + (paidLeft >= 0 ? paidLeft + 'd left' : 'EXPIRED')) : 'grace epoch',\n          paidStyle: 'color:' + (paidLeft != null && paidLeft < 5 ? 'oklch(0.5 0.16 27)' : 'var(--color-neutral-600)'),\n          audit: r.lastAudit ? ('audit ' + (r.lastAuditOk ? 'ok' : 'FAILED') + ' ' + self.fmtWhen(r.lastAudit)) : 'not audited yet',\n          auditStyle: 'color:' + (r.lastAudit && !r.lastAuditOk ? 'oklch(0.5 0.16 27)' : 'var(--color-neutral-600)'),\n          cycle: function () {\n            self.setState({ mktMsg: 'Auditing ' + (r.addr || r.url) + '\u2026' });\n            Z.runRentalCycle(true).then(function (res) {\n              var mine = res.filter(function (x) { return x.rental === r.id; })[0];\n              self.setState({ mktMsg: mine ? (mine.err ? mine.err : 'Audit ok \u2014 voucher signed and accepted.') : 'Done.' });\n            });\n          },\n          end: function () {\n            if (!self._endArmed || self._endArmed !== r.id) { self._endArmed = r.id; Z.toast('Press End again to stop paying this replica', 'err'); setTimeout(function () { self._endArmed = null; }, 5000); return; }\n            self._endArmed = null; Z.endRental(r.id); Z.toast('Replica ended \u2014 it lapses when the paid epoch runs out');\n          }\n        };\n      }),\n      onMktRpcSave: function () { Z.setMarketRpc(self.val('mktRpc')); Z.toast('RPC saved'); },\n      onAdminApply: function () {\n        Z.adminSetQuota(self.val('adminAcct'), self.val('adminMb').trim())\n          .then(function () { self.setState({ adminMsg: 'Quota set.' }); })\n          .catch(function (e) { self.setState({ adminMsg: e.message || 'Failed' }); });\n      },\n      onAdminList: function () {\n        Z.adminAccounts()\n          .then(function (list) {\n            self.setState({\n              adminMsg: list.length + ' account(s)',\n              adminRows: list.map(function (a) {\n                var used = ((a.used_bytes || 0) / 1048576).toFixed(2);\n                var quota = a.quota_bytes;\n                var bits = [];\n                if (a.online) bits.push('online');\n                if (a.pending) bits.push(a.pending + ' queued');\n                return {\n                  addr: String(a.id || '').slice(0, 20) + '\u2026',\n                  usage: used + ' MB / ' + (quota == null || quota < 0 ? '\u221e' : (quota / 1048576).toFixed(0) + ' MB') + (bits.length ? ' \u00b7 ' + bits.join(' \u00b7 ') : ''),\n                  ttl: a.last_seen ? self.fmtWhen(a.last_seen * (a.last_seen > 1e12 ? 1 : 1000)) : '',\n                  revoke: false\n                };\n              })\n            });\n          })\n          .catch(function (e) { self.setState({ adminMsg: e.message || 'Failed', adminRows: [] }); });\n      }\n    });\n    return vals;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
